version: "3.9"

services:
  db:
    image: postgres:16
    container_name: lego_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: lego_twin
      POSTGRES_USER: lego
      POSTGRES_PASSWORD: legopass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: lego_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: lego_api
    restart: unless-stopped
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    volumes:
      - ./apps/backend:/app
      - ./storage:/app/storage
    env_file:
      - ./apps/backend/.env
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: lego_worker
    restart: unless-stopped
    depends_on:
      - db
      - redis
    volumes:
      - ./apps/backend:/app
      - ./storage:/app/storage
    env_file:
      - ./apps/backend/.env
    command: rq worker --url redis://redis:6379 lego-queue

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: lego_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
